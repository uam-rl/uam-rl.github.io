name: "Deploy PDF and HTML to GitHub Pages"
on:
  push:
    branches: [ main, master ]
    paths:
      - 'typst-src/**'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - uses: cachix/install-nix-action@v31
      with:
        github_access_token: ${{ secrets.GITHUB_TOKEN }}
    - name: Build PDF in sandbox
      run: nix build .#pdf -o result-pdf
    - name: Build HTML in sandbox
      run: nix build .#html -o result-html
    - name: Create build directory and copy outputs
      run: |
        mkdir -p build
        cp result-pdf build/main.pdf
        cp result-html build/main.html
        chmod +w build/main.html
    - name: Fix SVG fills for Dark Reader compatibility
      run: python3 fix-svg-fills.py build/main.html
    - name: Copy HTML to index
      run: cp build/main.html build/index.html
    - name: Setup Pages
      uses: actions/configure-pages@v5
    - name: Upload artifact
      uses: actions/upload-pages-artifact@v3
      with:
        path: './build'
        
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
